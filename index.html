<body>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; background-color: #2c3e50; overflow: hidden; position: relative; }
        .snowflake { position: absolute; top: -10px; width: 10px; height: 10px; background-color: #fff; border-radius: 50%; opacity: 0.8; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(calc(-1 * var(--random-x))) translateY(100vh); }
        }
        .snowflake:nth-child(1) { --random-x: calc(100vw * 0.2); animation-duration: 10s; animation-delay: 0s; }
        .snowflake:nth-child(2) { --random-x: calc(100vw * 0.4); animation-duration: 12s; animation-delay: 2s; }
        .snowflake:nth-child(3) { --random-x: calc(100vw * 0.6); animation-duration: 8s; animation-delay: 4s; }
        .snowflake:nth-child(4) { --random-x: calc(100vw * 0.3); animation-duration: 15s; animation-delay: 1s; }
    </style>
    <div id="gamecontainer">
        <div id="gamescreen">
            <div id="sky" class="animated">
                <div id="flyarea">
                    <div id="ceiling" class="animated"></div>
                    <div id="ceiling2" class="animated"></div>
                    <div id="ceiling3" class="animated"></div>
                    <div id="player" class="pepe animated"></div>
                    <div id="bigscore" class="font-score"></div>
                    <div id="splash"></div>
                    <div id="scoreboard">
                        <h1 class="font-over">GAME OVER</h1>
                        <div class="card">

                            <div id="score-number" class="font-number">0</div>
                            <div id="highscore-label" class="font">HIGHSCORE</div>
                            <div id="highscore-number" class="font-number">0</div>
                            <div id="replay"><img src="/assets/replay.png" alt="replay"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="land" class="animated">
            <div id="debug"></div>
        </div>
    </div>
    <div class="boundingbox" id="playerbox"></div>
    <div class="boundingbox" id="pipebox"></div>
    <link rel="stylesheet" href="/css/menu.css">

        <a href="/"><i class="fa-solid fa-gamepad"></i></a>
        <a href="/include/settings.html"><i class="fa-solid fa-bars"></i></a>
    </div>
    <div class="container">
        <h1 id="payout">Highscore: 0</h1>
        <div id="payoutForm" style="display: none;">
            <p>Earn 1 PEPE per score point!</p>
            <p>Your score: <span id="finalScore"></span> | Payout: <span id="payoutAmount"></span> PEPE</p>
            <input type="text" id="walletAddress" placeholder="Enter wallet address (0x...)">
            <label><input type="checkbox" id="captcha"> I'm not a bot</label>
            <button id="submitButton" onclick="submitPayout()">Claim Payout</button>
            <p id="payoutMessage"></p>
        </div>
        <button class="copy-btn" onclick="window.open('https://pepelum.site/donations/', '_blank')">
            <i class="fa-solid fa-heart"></i> Support The Game Developer
        </button>
        <div class="volume">
            <label class="text-white" for="volume">Volume: <span id="volume-value">5</span>%</label>
            <input type="range" id="volume" name="volume" min="0" max="100" value="5">
        </div>
        <p class="donate-link">
            <a href="https://donate.pepelum.site/apps/36n5m4FkoHJP6MP7sXrTsjYM3pQW/crowdfund" target="_blank">Please read this message</a>
        </p>
        <hr>
        <p>Connect with community on <a href="https://pepecoin.org/discord" target="_blank"><strong><em>â±£epe</strong>coin</em></a> discord server.</p>
        <p class="mt-3 space links">
            <a href="https://pepecoin.org/" target="_blank" class="mx-2">Pepecoin.org</a>
            <a href="https://pepelum.site/" target="_blank" class="mx-2">Pepelum.site</a>
            <a href="https://pepeblocks.com/" target="_blank" class="mx-2">PepeBlocks.com</a>
            <a href="https://pepecoin-nodes.com/" target="_blank" class="mx-2">Pepecoin-nodes.com</a>
        </p>
    </div>
    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        const highscore = getCookie('highscore') || 0;
        document.addEventListener('DOMContentLoaded', () => {
            const highscoreElement = document.getElementById('highscore-number');
            if (highscoreElement) highscoreElement.textContent = highscore;
            const payoutElement = document.getElementById('payout');
            if (payoutElement) payoutElement.textContent = `Highscore: ${highscore}`;
        });
    </script>
